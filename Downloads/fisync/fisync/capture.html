<!doctype html>
<meta charset="utf-8">
<title>fisync capture</title>
<script>
(async () => {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 8 }, audio: false });
    const video = document.createElement('video');
    video.srcObject = stream;
    video.muted = true;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let busy = false;
    setInterval(() => {
      if (busy || !video.videoWidth) return;
      busy = true;
      const scale = Math.min(1, 1280 / video.videoWidth);     // keep frames small enough for Wi-Fi
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(async blob => {
        if (blob) window.fisync.sendFrame(await blob.arrayBuffer());
        busy = false;
      }, 'image/jpeg', 0.6);
    }, 125);
    stream.getVideoTracks()[0].onended = () => window.fisync.failed('Screen sharing stopped.');
  } catch (e) {
    window.fisync.failed('Could not capture the screen: ' + e.message);
  }
})();
</script>
