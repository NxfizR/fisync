<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fisync phone</title>
<link rel="stylesheet" href="/ui.css">
<style>
.msg{padding:6px 0;overflow-wrap:anywhere}
#calllist li,#threads li{cursor:pointer}
#photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
#photos img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line);border-radius:4px}
</style>
</head>
<body>
<main class="wide">
  <header><h1>fisync phone</h1><span id="status" class="mut">Phone not connected</span></header>

  <div id="banner" class="box" hidden>
    <p id="callText" style="margin:0 0 8px"></p>
    <div class="row"><button id="ans">Answer</button><button id="end">Hang up</button></div>
  </div>

  <div class="row"><button id="mirror">Share screen with phones</button></div>
  <p class="hint">Screen sharing needs the fisync desktop app.</p>
  <p id="err" class="hint"></p>

  <nav><button data-tab="calls" class="on">Calls</button><button data-tab="msgs">Messages</button><button data-tab="photos">Photos</button></nav>

  <section id="calls">
    <h2>Call a number</h2>
    <div class="row"><input id="num" inputmode="tel" placeholder="Phone number" aria-label="Phone number"><button id="dial">Call</button></div>
    <p class="hint">Your phone places the call, and the audio stays on the phone.</p>
    <h2>Recent calls</h2>
    <ul id="calllist"></ul>
  </section>

  <section id="msgs" hidden>
    <ul id="threads"></ul>
    <div id="thread" hidden>
      <button id="back">Back to conversations</button>
      <h2 id="to"></h2>
      <div id="bubbles"></div>
      <div class="row"><input id="body" placeholder="Write a message" aria-label="Message"><button id="sendmsg">Send</button></div>
    </div>
  </section>

  <section id="photos-tab" hidden>
    <h2>Photos from your phone</h2>
    <button id="sync">Sync latest photos</button>
    <p class="hint">Copies up to 30 new photos into the fisync folder.</p>
    <div id="photos"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const key = (location.hash.match(/key=([\w-]+)/) || [])[1] || sessionStorage.fisyncKey || '';
if (key) sessionStorage.fisyncKey = key;
history.replaceState(null, '', location.pathname);
const enc = encodeURIComponent;
const PANES = { calls: 'calls', msgs: 'msgs', photos: 'photos-tab' };
let ws, msgs = [], openThread = null, mirroringNow = false;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const el = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };
const when = t => new Date(+t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const KIND = { 1: 'in', 2: 'out', 3: 'missed' };

function tab(id) {
  for (const [k, sec] of Object.entries(PANES)) $('#' + sec).hidden = k !== id;
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  if (id === 'photos') loadPhotos();
}
$$('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));

function connect() {
  ws = new WebSocket(`ws://${location.host}/desk?token=${enc(key)}`);
  ws.onmessage = e => on(JSON.parse(e.data));
  ws.onclose = () => { setPhone(false); setTimeout(connect, 2000); };
}
function setPhone(on) { $('#status').textContent = on ? 'Phone connected' : 'Phone not connected'; }
function setMirror(on) {
  mirroringNow = on;
  $('#mirror').textContent = on ? 'Stop sharing screen' : 'Share screen with phones';
}
$('#mirror').onclick = () => send({ t: 'mirror', on: !mirroringNow });

function on(m) {
  if (m.t === 'phone') { setPhone(m.on); if (m.on) { send({ t: 'calls' }); send({ t: 'sms' }); } }
  else if (m.t === 'calls') drawCalls(m.items);
  else if (m.t === 'sms') { msgs = m.items; drawThreads(); }
  else if (m.t === 'smsin') { msgs.unshift({ address: m.from, body: m.body, date: m.date, type: 1 }); drawThreads(); }
  else if (m.t === 'call') callState(m);
  else if (m.t === 'photo' || m.t === 'photosdone') { if (!$('#photos-tab').hidden) loadPhotos(); }
  else if (m.t === 'mirror') setMirror(m.on);
  else if (m.t === 'error') $('#err').textContent = m.msg;
}

function callState(m) {
  $('#banner').hidden = m.state === 'IDLE';
  $('#ans').hidden = m.state !== 'RINGING';
  $('#end').textContent = m.state === 'RINGING' ? 'Decline' : 'Hang up';
  $('#callText').textContent = m.state === 'RINGING' ? `Incoming call${m.number ? ' from ' + m.number : ''}` : 'On a call';
  if (m.state === 'IDLE') setTimeout(() => send({ t: 'calls' }), 800);
}
$('#ans').onclick = () => send({ t: 'answer' });
$('#end').onclick = () => send({ t: 'hangup' });
const dial = () => { const n = $('#num').value.trim(); if (n) send({ t: 'dial', n }); };
$('#dial').onclick = dial;
$('#num').onkeydown = e => { if (e.key === 'Enter') dial(); };

function drawCalls(items) {
  const ul = $('#calllist');
  ul.replaceChildren();
  items.forEach(c => {
    const li = document.createElement('li');
    li.append(el('span', c.name || c.number || 'Unknown'), el('span', `${KIND[c.type] || ''} · ${when(c.date)}`, 'mut'));
    li.onclick = () => { $('#num').value = c.number || ''; };
    ul.append(li);
  });
}

function drawThreads() {
  const by = new Map();
  msgs.forEach(m => { if (!by.has(m.address)) by.set(m.address, m); });
  const ul = $('#threads');
  ul.replaceChildren();
  by.forEach((last, addr) => {
    const li = document.createElement('li');
    li.append(el('span', addr), el('span', (last.body || '').slice(0, 40), 'mut'));
    li.onclick = () => { openThread = addr; drawThread(); };
    ul.append(li);
  });
  drawThread();
}

function drawThread() {
  $('#threads').hidden = !!openThread;
  $('#thread').hidden = !openThread;
  if (!openThread) return;
  $('#to').textContent = openThread;
  const box = $('#bubbles');
  box.replaceChildren();
  msgs.filter(m => m.address === openThread).reverse().forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg';
    d.append(el('span', m.type === 2 ? 'You: ' : 'Them: ', 'mut'), document.createTextNode(m.body || ''));
    box.append(d);
  });
}
$('#back').onclick = () => { openThread = null; drawThread(); };
function sendText() {
  const body = $('#body').value.trim();
  if (!body || !openThread) return;
  send({ t: 'sendsms', to: openThread, body });
  msgs.unshift({ address: openThread, body, date: Date.now(), type: 2 });
  $('#body').value = '';
  drawThread();
  setTimeout(() => send({ t: 'sms' }), 3000);
}
$('#sendmsg').onclick = sendText;
$('#body').onkeydown = e => { if (e.key === 'Enter') sendText(); };

async function loadPhotos() {
  const r = await fetch('/api/files', { headers: { 'x-token': key } }).catch(() => null);
  if (!r || !r.ok) return;
  const box = $('#photos');
  box.replaceChildren();
  for (const f of (await r.json()).filter(f => /\.(jpe?g|png|webp|gif)$/i.test(f.name))) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = f.name;
    img.src = `/api/files/${enc(f.name)}?token=${enc(key)}`;
    box.append(img);
  }
}
$('#sync').onclick = () => { $('#err').textContent = ''; send({ t: 'syncphotos' }); };

tab('calls');
setMirror(false);
if (key) connect();
else $('#err').textContent = 'Open the phone panel from the fisync window.';
</script>
</body>
</html>
