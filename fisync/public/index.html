<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fisync</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#6b6b72;--line:#e7e7ea;--surf:#f5f5f7}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0d;--fg:#f2f2f3;--mut:#9a9aa2;--line:#26262a;--surf:#161618}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:28px}
header span:first-child{color:var(--fg);font-weight:600;letter-spacing:.02em}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0;border-radius:0}
button{cursor:pointer}
button:active{opacity:.4}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}
nav{display:flex;gap:20px;margin-bottom:20px}
nav button{color:var(--mut);padding-bottom:4px;border-bottom:1.5px solid transparent}
nav .on{color:var(--fg);border-color:var(--fg)}
#pad{height:44vh;min-height:220px;background:var(--surf);border-radius:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.hint,#err,#prog,.mut{color:var(--mut)}
.hint,#err,#prog{font-size:13px;margin:10px 0 0}
.row{display:flex;gap:10px;margin-top:14px}
.row.two button{flex:1;padding:12px;background:var(--surf);border-radius:12px}
.row input{flex:1;min-width:0;padding:12px 0;border-bottom:1px solid var(--line)}
.row input:focus{outline:0;border-color:var(--fg)}
.keys{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:18px;color:var(--mut)}
.keys button{padding:8px 0}
.pick{display:inline-block;border-bottom:1.5px solid var(--fg);cursor:pointer}
ul{list-style:none;padding:0;margin:20px 0}
li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
li a{color:inherit;text-decoration:none;overflow-wrap:anywhere}
#login input{display:block;width:100%;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
#login input:focus{outline:0;border-color:var(--fg)}
#login button{border-bottom:1.5px solid var(--fg)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><span>fisync</span><span id="who"></span></header>

  <section id="login" hidden>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN from your computer" autocomplete="off" aria-label="PIN">
    <button id="go">Connect</button>
    <p id="err"></p>
  </section>

  <section id="app" hidden>
    <nav><button data-tab="ctl" class="on">Control</button><button data-tab="files">Files</button></nav>

    <div id="ctl">
      <div id="pad" role="application" aria-label="Trackpad"></div>
      <p class="hint">Tap to click. Two fingers to scroll or right-click.</p>
      <div class="row two"><button data-c="left">Left click</button><button data-c="right">Right click</button></div>
      <div class="row"><input id="txt" placeholder="Type here" autocomplete="off" aria-label="Text to type"><button id="send">Send</button></div>
      <div class="keys">
        <button data-k="Escape">esc</button><button data-k="Tab">tab</button>
        <button data-k="Backspace" aria-label="Backspace">&#9003;</button><button data-k="Enter" aria-label="Enter">&#9166;</button>
        <button data-k="Left" aria-label="Left arrow">&larr;</button><button data-k="Up" aria-label="Up arrow">&uarr;</button>
        <button data-k="Down" aria-label="Down arrow">&darr;</button><button data-k="Right" aria-label="Right arrow">&rarr;</button>
        <button data-k="AudioVolDown">vol &minus;</button><button data-k="AudioVolUp">vol +</button>
        <button data-k="AudioMute">mute</button><button data-k="AudioPlay">play</button>
      </div>
    </div>

    <div id="files" hidden>
      <label class="pick" id="drop"><input id="up" type="file" multiple hidden>Send files</label>
      <p id="prog"></p>
      <ul id="list"></ul>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let pin = (location.hash.match(/pin=(\d+)/) || [])[1] || sessionStorage.pin || '';
history.replaceState(null, '', location.pathname);
let ws;

const api = (p, o = {}) => fetch(p, { ...o, headers: { 'x-pin': pin, ...(o.headers || {}) } });
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
const fmt = n => n > 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.ceil(n / 1e3) + ' KB';

function show(id) {
  ['ctl', 'files'].forEach(x => $('#' + x).hidden = x !== id);
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  if (id === 'files') refresh();
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?pin=${pin}`);
  ws.onclose = () => setTimeout(connect, 1500);
}

async function start() {
  const r = pin ? await api('/api/info').catch(() => null) : null;
  if (!r || !r.ok) {
    $('#login').hidden = false; $('#app').hidden = true;
    if (pin) $('#err').textContent = r ? 'That PIN did not work. After 5 tries you have to wait a minute.' : 'Cannot reach the computer. Check that you are on the same Wi-Fi.';
    return;
  }
  sessionStorage.pin = pin;
  const info = await r.json();
  $('#who').textContent = info.host;
  $('#login').hidden = true; $('#app').hidden = false;
  if (info.control) connect();
  else { $('#ctl').innerHTML = '<p class="mut">Mouse and keyboard control is not available on this device. File transfer still works.</p>'; show('files'); }
  refresh();
}

// ---- trackpad
const pad = $('#pad');
let last, travel = 0, t0 = 0, maxFingers = 0, acc = 0;
const mid = ts => ({
  x: [...ts].reduce((a, t) => a + t.clientX, 0) / ts.length,
  y: [...ts].reduce((a, t) => a + t.clientY, 0) / ts.length,
});
pad.ontouchstart = e => {
  e.preventDefault();
  if (e.touches.length === 1) { travel = 0; t0 = Date.now(); maxFingers = 0; }
  maxFingers = Math.max(maxFingers, e.touches.length);
  last = mid(e.touches);
};
pad.ontouchmove = e => {
  e.preventDefault();
  const c = mid(e.touches), dx = c.x - last.x, dy = c.y - last.y;
  last = c; travel += Math.abs(dx) + Math.abs(dy);
  if (e.touches.length > 1) {
    acc -= dy / 4;                       // fingers down = page moves down
    const n = Math.trunc(acc);
    if (n) { acc -= n; send({ t: 'scroll', dy: n }); }
  } else send({ t: 'move', dx: dx * 1.8, dy: dy * 1.8 });
};
pad.ontouchend = e => {
  e.preventDefault();
  if (e.touches.length) last = mid(e.touches);
  else if (travel < 8 && Date.now() - t0 < 300) send({ t: 'click', b: maxFingers > 1 ? 'right' : 'left' });
};
$$('[data-c]').forEach(b => b.onclick = () => send({ t: 'click', b: b.dataset.c }));
$$('[data-k]').forEach(b => b.onclick = () => send({ t: 'key', k: b.dataset.k }));
$('#send').onclick = () => { const s = $('#txt').value; if (s) { send({ t: 'text', s }); $('#txt').value = ''; } };

// ---- files
async function refresh() {
  const r = await api('/api/files').catch(() => null);
  if (!r || !r.ok) return;
  const list = $('#list');
  list.replaceChildren();
  for (const f of await r.json()) {
    const li = document.createElement('li'), a = document.createElement('a'), s = document.createElement('span');
    a.textContent = f.name;
    a.href = `/api/files/${encodeURIComponent(f.name)}?pin=${pin}`;
    a.download = f.name;
    s.textContent = fmt(f.size); s.className = 'mut';
    li.append(a, s); list.append(li);
  }
  if (!list.children.length) list.innerHTML = '<li class="mut">No files yet. Anything you put in the fisync folder on the computer shows up here.</li>';
}

async function upload(files) {
  for (const f of files) await new Promise(done => {
    const x = new XMLHttpRequest();
    x.open('PUT', '/api/files/' + encodeURIComponent(f.name));
    x.setRequestHeader('x-pin', pin);
    x.upload.onprogress = p => $('#prog').textContent = `Sending ${f.name}: ${Math.round(p.loaded / p.total * 100)}%`;
    x.onloadend = () => { $('#prog').textContent = x.status === 200 ? `Sent ${f.name}` : `Could not send ${f.name}`; done(); };
    x.send(f);
  });
  refresh();
}
$('#up').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
$('#drop').ondragover = e => e.preventDefault();
$('#drop').ondrop = e => { e.preventDefault(); upload([...e.dataTransfer.files]); };

$$('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
$('#txt').onkeydown = e => { if (e.key === 'Enter') $('#send').click(); };
$('#pin').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
$('#go').onclick = () => { pin = $('#pin').value.trim(); start(); };
setInterval(() => { if ($('#app').hidden === false && $('#files').hidden === false) refresh(); }, 5000);
start();
</script>
</body>
</html>
