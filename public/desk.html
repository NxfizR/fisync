<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fisync phone</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#6b6b72;--line:#e7e7ea;--surf:#f5f5f7}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0d;--fg:#f2f2f3;--mut:#9a9aa2;--line:#26262a;--surf:#161618}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:720px;margin:0 auto;padding:24px 20px}
header{display:flex;justify-content:space-between;color:var(--mut);margin-bottom:24px}
header b{color:var(--fg)}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0}
button{cursor:pointer}
button:active{opacity:.4}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}
nav{display:flex;gap:20px;margin-bottom:20px}
nav button{color:var(--mut);padding-bottom:4px;border-bottom:1.5px solid transparent}
nav .on{color:var(--fg);border-color:var(--fg)}
input{border-bottom:1px solid var(--line);padding:10px 0;width:100%}
input:focus{outline:0;border-color:var(--fg)}
.row{display:flex;gap:16px;align-items:center}
.pill{background:var(--surf);border-radius:12px;padding:10px 16px;white-space:nowrap}
#banner{background:var(--surf);border-radius:14px;padding:14px 16px;margin-bottom:18px}
ul{list-style:none;padding:0;margin:16px 0}
li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mut{color:var(--mut)}
.msg{width:fit-content;max-width:80%;padding:8px 12px;border-radius:14px;background:var(--surf);margin:6px 0;overflow-wrap:anywhere}
.me{margin-left:auto;background:var(--fg);color:var(--bg)}
#photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:16px}
#photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--surf)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><b>fisync phone</b><span id="status">Phone not connected</span></header>
  <div id="banner" hidden>
    <div id="callText"></div>
    <div class="row" style="margin-top:10px"><button id="ans" class="pill">Answer</button><button id="end" class="pill">Hang up</button></div>
  </div>
  <p id="err" class="mut"></p>

  <nav><button data-tab="calls" class="on">Calls</button><button data-tab="msgs">Messages</button><button data-tab="photos">Photos</button></nav>

  <section id="calls">
    <div class="row"><input id="num" inputmode="tel" placeholder="Number to call" aria-label="Number to call"><button id="dial" class="pill">Call</button></div>
    <p class="mut">The call is placed by your phone, and the audio stays on the phone.</p>
    <ul id="calllist"></ul>
  </section>

  <section id="msgs" hidden>
    <ul id="threads"></ul>
    <div id="thread" hidden>
      <button id="back" class="mut">&larr; All messages</button>
      <h3 id="to"></h3>
      <div id="bubbles"></div>
      <input id="body" placeholder="Write a message and press Enter" aria-label="Message">
    </div>
  </section>

  <section id="photos-tab" hidden>
    <button id="sync" class="pill">Sync latest photos</button>
    <div id="photos"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const pin = (location.hash.match(/pin=(\d+)/) || [])[1] || sessionStorage.pin || '';
sessionStorage.pin = pin;
history.replaceState(null, '', location.pathname);
let ws, msgs = [], openThread = null;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const el = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };
const when = t => new Date(+t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const KIND = { 1: 'in', 2: 'out', 3: 'missed' };

function tab(id) {
  ['calls', 'msgs', 'photos-tab'].forEach(x => $('#' + x).hidden = x !== (id === 'photos' ? 'photos-tab' : id));
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  if (id === 'photos') loadPhotos();
}
$$('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));

function connect() {
  ws = new WebSocket(`ws://${location.host}/desk?pin=${pin}`);
  ws.onmessage = e => on(JSON.parse(e.data));
  ws.onclose = () => { status(false); setTimeout(connect, 2000); };
}
const status = on => $('#status').textContent = on ? 'Phone connected' : 'Phone not connected';

function on(m) {
  if (m.t === 'phone') { status(m.on); if (m.on) { send({ t: 'calls' }); send({ t: 'sms' }); } }
  else if (m.t === 'calls') drawCalls(m.items);
  else if (m.t === 'sms') { msgs = m.items; drawThreads(); }
  else if (m.t === 'smsin') { msgs.unshift({ address: m.from, body: m.body, date: m.date, type: 1 }); drawThreads(); }
  else if (m.t === 'call') callState(m);
  else if (m.t === 'photo' || m.t === 'photosdone') loadPhotos();
  else if (m.t === 'error') $('#err').textContent = m.msg;
}

function callState(m) {
  const b = $('#banner');
  b.hidden = m.state === 'IDLE';
  $('#ans').hidden = m.state !== 'RINGING';
  $('#end').textContent = m.state === 'RINGING' ? 'Decline' : 'Hang up';
  $('#callText').textContent = m.state === 'RINGING' ? `Incoming call${m.number ? ' from ' + m.number : ''}` : 'On a call';
  if (m.state === 'IDLE') setTimeout(() => send({ t: 'calls' }), 800);
}
$('#ans').onclick = () => send({ t: 'answer' });
$('#end').onclick = () => send({ t: 'hangup' });
$('#dial').onclick = () => { const n = $('#num').value.trim(); if (n) send({ t: 'dial', n }); };
$('#num').onkeydown = e => { if (e.key === 'Enter') $('#dial').click(); };

function drawCalls(items) {
  const ul = $('#calllist');
  ul.replaceChildren();
  items.forEach(c => {
    const li = document.createElement('li');
    li.append(el('span', c.name || c.number || 'Unknown'), el('span', `${KIND[c.type] || ''} · ${when(c.date)}`, 'mut'));
    li.onclick = () => { $('#num').value = c.number || ''; };
    ul.append(li);
  });
}

function drawThreads() {
  const by = new Map();
  msgs.forEach(m => { if (!by.has(m.address)) by.set(m.address, m); });
  const ul = $('#threads');
  ul.replaceChildren();
  by.forEach((last, addr) => {
    const li = document.createElement('li');
    li.append(el('span', addr), el('span', (last.body || '').slice(0, 40), 'mut'));
    li.onclick = () => { openThread = addr; drawThread(); };
    ul.append(li);
  });
  drawThread();
}

function drawThread() {
  $('#threads').hidden = !!openThread;
  $('#thread').hidden = !openThread;
  if (!openThread) return;
  $('#to').textContent = openThread;
  const box = $('#bubbles');
  box.replaceChildren();
  msgs.filter(m => m.address === openThread).reverse()
    .forEach(m => box.append(el('div', m.body || '', m.type === 2 ? 'msg me' : 'msg')));
}
$('#back').onclick = () => { openThread = null; drawThread(); };
$('#body').onkeydown = e => {
  const body = $('#body').value.trim();
  if (e.key !== 'Enter' || !body || !openThread) return;
  send({ t: 'sendsms', to: openThread, body });
  msgs.unshift({ address: openThread, body, date: Date.now(), type: 2 });
  $('#body').value = '';
  drawThread();
  setTimeout(() => send({ t: 'sms' }), 3000);
};

async function loadPhotos() {
  const r = await fetch('/api/files', { headers: { 'x-pin': pin } }).catch(() => null);
  if (!r || !r.ok) return;
  const box = $('#photos');
  box.replaceChildren();
  (await r.json()).filter(f => /\.(jpe?g|png|webp|gif)$/i.test(f.name)).forEach(f => {
    const img = document.createElement('img');
    img.loading = 'lazy'; img.alt = f.name;
    img.src = `/api/files/${encodeURIComponent(f.name)}?pin=${pin}`;
    box.append(img);
  });
}
$('#sync').onclick = () => { $('#err').textContent = ''; send({ t: 'syncphotos' }); };

if (pin) connect();
else $('#err').textContent = 'Open this page from the fisync window so the PIN is filled in.';
</script>
</body>
</html>
